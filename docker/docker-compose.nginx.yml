services:
  nginx:
    image: mesudip/nginx-proxy:v3.3.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/ssl:/etc/ssl
      - /etc/nginx/dhparam:/etc/nginx/dhparam
      - /var/log/nginx:/var/log/nginx
    mem_limit: 256m
    restart: always