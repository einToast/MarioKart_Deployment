services:
  frontend:
    image: eintoast/mariokart_frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_BACKEND_PROTOCOL: ${BACKEND_API_PROTOCOL}
      REACT_APP_BACKEND_URL: ${BACKEND_API_HOST}
      REACT_APP_BACKEND_PORT: ${BACKEND_API_PORT}
      REACT_APP_BACKEND_PATH: ${BACKEND_API_PATH}
      REACT_APP_BACKEND_WS_PROTOCOL: ${BACKEND_WS_PROTOCOL}
      REACT_APP_BACKEND_WS_URL: ${BACKEND_WS_HOST}
      REACT_APP_BACKEND_WS_PORT: ${BACKEND_WS_PORT}
      REACT_APP_BACKEND_WS_PATH: ${BACKEND_WS_PATH}
      VIRTUAL_HOST: ${FRONTEND_VIRTUAL_HOST}
    restart: always

  backend:
    image: eintoast/mariokart_backend:latest
    depends_on:
      db:
        condition: service_healthy
      schedule:
        condition: service_healthy
      ocr:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      USER_NAME: ${USER_NAME}
      USER_PASSWORD: ${USER_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: ${POSTGRES_HOST}
      DB_USER: ${POSTGRES_USER}
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      SCHEDULE_PROTOCOL: ${SCHEDULE_PROTOCOL}
      SCHEDULE_HOST: ${SCHEDULE_HOST}
      SCHEDULE_PORT: ${SCHEDULE_PORT}
      OCR_PROTOCOL: ${OCR_PROTOCOL}
      OCR_HOST: ${OCR_HOST}
      OCR_PORT: ${OCR_PORT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      DOMAIN: ${FRONTEND_PROTOCOL}://${FRONTEND_HOST}
      VIRTUAL_HOST: ${BACKEND_VIRTUAL_HOST}
      TZ: ${TZ}
    restart: always

  schedule:
    image: eintoast/mariokart_schedule:latest
    restart: always

  ocr:
    image: eintoast/mariokart_ocr:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    restart: always

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  postgres_data: