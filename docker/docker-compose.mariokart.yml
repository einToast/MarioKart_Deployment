services:
  frontend:
    image: eintoast/mariokart_frontend:latest
    ports:
      - "${FRONTEND_PORT}:5000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      REACT_APP_BACKEND_PROTOCOL: ${BACKEND_API_PROTOCOL}
      REACT_APP_BACKEND_URL: ${BACKEND_API_HOST}
      REACT_APP_BACKEND_PORT: ${BACKEND_API_PORT}
      REACT_APP_BACKEND_PATH: ${BACKEND_API_PATH}
      REACT_APP_BACKEND_WS_PROTOCOL: ${BACKEND_WS_PROTOCOL}
      REACT_APP_BACKEND_WS_URL: ${BACKEND_WS_HOST}
      REACT_APP_BACKEND_WS_PORT: ${BACKEND_WS_PORT}
      REACT_APP_BACKEND_WS_PATH: ${BACKEND_WS_PATH}
      VIRTUAL_HOST: ${FRONTEND_VIRTUAL_HOST}
      TZ: ${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro  # integrate host time
      - /etc/timezone:/etc/timezone:ro    # integrate host timezone

    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.1
        order: start-first
  backend:
    image: eintoast/mariokart_backend:latest
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
      schedule:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/public/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      USER_NAME: ${USER_NAME}
      USER_PASSWORD: ${USER_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: ${POSTGRES_HOST}
      DB_USER: ${POSTGRES_USER}
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      SCHEDULE_PROTOCOL: ${SCHEDULE_PROTOCOL}
      SCHEDULE_HOST: ${SCHEDULE_HOST}
      SCHEDULE_PORT: ${SCHEDULE_PORT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
      DOMAIN: ${FRONTEND_PROTOCOL}://${FRONTEND_HOST}
      VIRTUAL_HOST: ${BACKEND_VIRTUAL_HOST}
      TZ: ${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro  # integrate host time
      - /etc/timezone:/etc/timezone:ro    # integrate host timezone

    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.1
        order: start-first
  schedule:
    image: eintoast/mariokart_schedule:latest
    ports:
      - "${SCHEDULE_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.1
        order: start-first

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.1
        order: start-first

volumes:
  postgres_data: