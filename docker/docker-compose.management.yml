services:
  portainer: 
    image: portainer/portainer-ce:latest
    expose:
      - "9000"
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock 
      - ./portainer_data:/data 
    environment: 
      VIRTUAL_HOST: ${PORTAINER_VIRTUAL_HOST}
    restart: always 

