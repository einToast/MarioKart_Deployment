#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  # - nginx

write_files:
  - path: /etc/apt/keyrings/docker.asc
    permissions: "0644"
    content: ""
  - path: /etc/apt/sources.list.d/docker.sources
    permissions: "0644"
    # change noble to relevant ubuntu version
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: noble
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc


runcmd:

- apt-get update
- apt-get upgrade -y

- apt-get remove $(dpkg --get-selections docker.io docker-compose docker-compose-v2 docker-doc podman-docker containerd runc | cut -f1) -y || true
- apt-get update
- install -m 0755 -d /etc/apt/keyrings
- curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
- chmod a+r /etc/apt/keyrings/docker.asc
- apt-get update
- apt-get install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

